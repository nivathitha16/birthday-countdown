<!DOCTYPE html>
<html>

<head>

<title>For You ❤️</title>

<style>

body{

margin:0;

background:linear-gradient(
to bottom,
#fff0f5,
#ffe4ec
);

font-family:Arial;

text-align:center;

overflow:hidden;

}

.container{

padding-top:100px;

z-index:2;

position:relative;

}

h1{

color:#ff4d6d;

font-size:40px;

}

p{

font-size:20px;

color:#444;

}

#countdown{

font-size:35px;

font-weight:bold;

color:#ff4d6d;

margin-top:20px;

}

button{

margin-top:30px;

padding:15px;

font-size:18px;

background:#ff4d6d;

color:white;

border:none;

border-radius:15px;

cursor:pointer;

}

.heart{

position:fixed;

font-size:20px;

animation:float 8s linear infinite;

opacity:0.7;

}

@keyframes float{

0%{

transform:translateY(100vh);

}

100%{

transform:translateY(-100px);

}

}

.footer{

margin-top:50px;

font-size:18px;

color:#666;

}

</style>

</head>

<body>

<div class="container">

<h1>❤️ Happy Birthday ❤️</h1>

<p>

Thank you for being part of my story 🫶🏻

</p>

<p>

Countdown till 29 May 2026 💝

</p>

<div id="countdown"></div>

<button onclick="fireworks()">

🎆 Click for Surprise

</button>

<div class="footer">

Every moment with you became my favourite memory ❤️

</div>

</div>

<script>

var countDownDate =
new Date(
"May 29, 2026 00:00:00"
).getTime();

setInterval(function(){

var now=
new Date().getTime();

var distance=
countDownDate-now;

var days=
Math.floor(
distance/
(1000*60*60*24)
);

document.getElementById(
"countdown"
).innerHTML=
days+" Days Left ❤️";

},1000);

function fireworks(){

for(let i=0;i<80;i++){

let item=
document.createElement(
"div"
);

let emoji=
["🎆","✨","💖","🎉","❤️"];

item.innerHTML=
emoji[
Math.floor(
Math.random()*emoji.length
)
];

item.style.position=
"fixed";

item.style.left=
Math.random()*100+
"vw";

item.style.top=
Math.random()*100+
"vh";

item.style.fontSize=
"30px";

document.body.appendChild(
item
);

setTimeout(
()=>item.remove(),
2500
);

}

alert(

"Happy Birthday ❤️🎂\n\nMay this year bring you happiness, success and smiles 🫶🏻"

);

}

setInterval(()=>{

let heart=
document.createElement(
"div"
);

heart.className=
"heart";

heart.innerHTML=
"💖";

heart.style.left=
Math.random()*100+
"vw";

heart.style.animationDuration=
(5+Math.random()*5)
+"s";

document.body.appendChild(
heart
);

setTimeout(
()=>heart.remove(),
8000
);

},800);

</script>

</body>

</html>
