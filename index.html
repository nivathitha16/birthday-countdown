<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content=
"width=device-width,
initial-scale=1">

<title>
For You ❤️
</title>

<style>

body{

margin:0;

font-family:
Georgia;

background:

linear-gradient(
180deg,

#fff8f7 0%,

#fff0f3 50%,

#fff7ef 100%

);

text-align:center;

overflow:hidden;

color:#6d2d37;

position:relative;

}

body::before{

content:"";

position:fixed;

inset:0;

background:

url(
https://www.transparenttextures.com/patterns/stardust.png
);

opacity:.2;

z-index:-1;

}

.container{

padding:
60px 25px;

}

h1{

font-size:58px;

line-height:1.15;

margin-bottom:25px;

}

p{

font-size:22px;

opacity:.85;

}

.grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:20px;

margin-top:45px;

}

.box{

background:

rgba(
255,
255,
255,
0.85
);

padding:30px;

border-radius:30px;

backdrop-filter:
blur(10px);

box-shadow:

0 10px 30px

rgba(
255,
150,
180,
0.2
);

}

.number{

font-size:60px;

font-weight:bold;

color:#8b1f36;

}

.label{

font-size:18px;

margin-top:10px;

letter-spacing:2px;

}

.popup{

display:none;

position:fixed;

top:50%;

left:50%;

transform:
translate(
-50%,
-50%
);

background:white;

padding:30px;

border-radius:30px;

width:300px;

box-shadow:

0 10px 30px

rgba(
0,0,0,.15
);

z-index:999;

}

.popup img{

width:170px;

border-radius:20px;

margin-top:10px;

}

button{

background:

linear-gradient(
to right,
#8b1f36,
#c64d68
);

border:none;

color:white;

padding:
14px 24px;

border-radius:25px;

margin-top:15px;

}

.floating{

position:fixed;

font-size:24px;

animation:
float 10s linear infinite;

opacity:.6;

}

@keyframes float{

0%{

transform:
translateY(
100vh
);

opacity:0;

}

20%{

opacity:.8;

}

100%{

transform:
translateY(
-100px
);

opacity:0;

}

}

</style>

</head>

<body>

<div class="container">

<h1>

Counting down

every moment

until your special

day arrives...

</h1>

<p>

because some people

are worth waiting for ✨

</p>

<div class="grid">

<div class="box">

<div id="days"
class="number">

0

</div>

<div class="label">

DAYS

</div>

</div>

<div class="box">

<div id="hours"
class="number">

0

</div>

<div class="label">

HOURS

</div>

</div>

<div class="box">

<div id="mins"
class="number">

0

</div>

<div class="label">

MINS

</div>

</div>

<div class="box">

<div id="secs"
class="number">

0

</div>

<div class="label">

SECS

</div>

</div>

</div>

</div>

<div
id="wishPopup"
class="popup">

<h2>

✨ One minute left!

</h2>

<p>

Close your eyes

and make a wish 💝

</p>

<button

onclick=

document
.getElementById(
'wishPopup'
)

.style.display=

'none'

>

Okay ❤️

</button>

</div>

<div
id="birthdayPopup"
class="popup">

<h1>

🎂 Happy Birthday ❤️

</h1>

<p>

The wait is over 🫶🏻

</p>

<img

src=

"https://i.pinimg.com/736x/1f/7f/7c/1f7f7ca25c1cbdf2fd8992ef1a88cb9d.jpg"

>

<p>

Hope this year

brings happiness ✨

</p>

</div>

<script>

let target=

new Date(

"May 29, 2026 00:00:00"

).getTime();

let shown=false;

setInterval(()=>{

let now=

new Date()
.getTime();

let diff=

target-now;

let days=

Math.floor(
diff/
(1000*60*60*24)
);

let hours=

Math.floor(
(
diff%
(1000*60*60*24)
)
/
(1000*60*60)
);

let mins=

Math.floor(
(
diff%
(1000*60*60)
)
/
(1000*60)
);

let secs=

Math.floor(
(
diff%
(1000*60)
)
/
1000
);

document
.getElementById(
"days"
)
.innerHTML=
days;

document
.getElementById(
"hours"
)
.innerHTML=
hours;

document
.getElementById(
"mins"
)
.innerHTML=
mins;

document
.getElementById(
"secs"
)
.innerHTML=
secs;

if(

days==0

&&

hours==0

&&

mins==1

&&

!shown

){

shown=true;

document
.getElementById(
"wishPopup"
)

.style.display=
"block";

}

if(diff<=0){

document
.getElementById(
"birthdayPopup"
)

.style.display=
"block";

}

},1000);

setInterval(()=>{

let e=

document
.createElement(
"div"
);

e.className=
"floating";

let icons=

["💖","🌸","✨","🎀","🫶🏻"];

e.innerHTML=

icons[
Math.floor(
Math.random()*5
)
];

e.style.left=

Math.random()*100

+"vw";

document.body
.appendChild(
e
);

setTimeout(
()=>e.remove(),
10000
);

},1000);

</script>

</body>

</html>
