<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>For You ❤️</title>

<style>

body{

margin:0;

font-family:Georgia;

background:#fdf8f2;

text-align:center;

overflow:hidden;

color:#5a2a2a;

}

.container{

padding-top:70px;

}

h1{

font-size:42px;

line-height:1.3;

}

.grid{

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

margin-top:40px;

}

.box{

background:white;

padding:25px;

border-radius:20px;

width:90px;

box-shadow:
0 5px 20px
rgba(0,0,0,.1);

}

.number{

font-size:40px;

font-weight:bold;

color:#7d0f24;

}

.label{

margin-top:8px;

font-size:14px;

}

.popup{

display:none;

position:fixed;

top:50%;

left:50%;

transform:
translate(-50%,-50%);

background:white;

padding:30px;

border-radius:25px;

box-shadow:
0 10px 30px
rgba(0,0,0,.2);

z-index:999;

width:300px;

}

img{

width:160px;

border-radius:20px;

margin-top:10px;

}

button{

background:#7d0f24;

color:white;

padding:14px 25px;

border:none;

border-radius:25px;

margin-top:15px;

}

</style>

</head>

<body>

<div class="container">

<h1>

Counting down every moment

until your special day arrives...

</h1>

<p>

because some people
are worth waiting for ✨

</p>

<div class="grid">

<div class="box">

<div id="days"
class="number">
0
</div>

<div class="label">
DAYS
</div>

</div>

<div class="box">

<div id="hours"
class="number">
0
</div>

<div class="label">
HOURS
</div>

</div>

<div class="box">

<div id="mins"
class="number">
0
</div>

<div class="label">
MINS
</div>

</div>

<div class="box">

<div id="secs"
class="number">
0
</div>

<div class="label">
SECS
</div>

</div>

</div>

</div>

<div id="wishPopup"
class="popup">

<h2>

✨ Just one minute left!

</h2>

<p>

Close your eyes
and make a wish 💝

</p>

<button
onclick=

document.getElementById(
'wishPopup'
).style.display='none'>

Okay ❤️

</button>

</div>

<div id="birthdayPopup"
class="popup">

<h1>

🎂 Happy Birthday ❤️

</h1>

<p>

The wait is over 🫶🏻

</p>

<img
src=

"https://i.pinimg.com/736x/1f/7f/7c/1f7f7ca25c1cbdf2fd8992ef1a88cb9d.jpg"

>

<p>

Hope this year brings
you happiness ✨

</p>

</div>

<script>

let target=

new Date(

"May 29, 2026 00:00:00"

).getTime();

let wishShown=false;

setInterval(()=>{

let now=

new Date().getTime();

let diff=

target-now;

let days=
Math.floor(
diff/
(1000*60*60*24)
);

let hours=
Math.floor(
(diff%
(1000*60*60*24))
/
(1000*60*60)
);

let mins=
Math.floor(
(diff%
(1000*60*60))
/
(1000*60)
);

let secs=
Math.floor(
(diff%
(1000*60))
/
1000
);

document
.getElementById(
"days"
).innerHTML=
days;

document
.getElementById(
"hours"
).innerHTML=
hours;

document
.getElementById(
"mins"
).innerHTML=
mins;

document
.getElementById(
"secs"
).innerHTML=
secs;

if(

days==0

&&

hours==0

&&

mins==1

&&

!wishShown

){

wishShown=true;

document
.getElementById(
"wishPopup"
)

.style.display=
"block";

}

if(diff<=0){

document
.getElementById(
"birthdayPopup"
)

.style.display=
"block";

}

},

1000

);

</script>

</body>

</html>
