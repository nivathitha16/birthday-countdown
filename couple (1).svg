<svg width="100%" viewBox="0 0 380 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Birthday couple illustration</title>
<desc>A cute cartoon boy and girl celebrating a birthday with a cake between them</desc>
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="0%" r="90%">
    <stop offset="0%" stop-color="#3d0040"/>
    <stop offset="60%" stop-color="#1a0022"/>
    <stop offset="100%" stop-color="#0d0010"/>
  </radialGradient>
  <radialGradient id="skinB" cx="40%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#fcd5b4"/>
    <stop offset="100%" stop-color="#f0a070"/>
  </radialGradient>
  <radialGradient id="skinG" cx="40%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#fde0cc"/>
    <stop offset="100%" stop-color="#f5b08a"/>
  </radialGradient>
  <radialGradient id="cakeTop" cx="50%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#ffb3cc"/>
    <stop offset="100%" stop-color="#ff6b95"/>
  </radialGradient>
  <radialGradient id="cakeBot" cx="50%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#ff8fab"/>
    <stop offset="100%" stop-color="#d63a6a"/>
  </radialGradient>
  <radialGradient id="flameR" cx="40%" cy="25%" r="65%">
    <stop offset="0%" stop-color="#fffde7"/>
    <stop offset="40%" stop-color="#ffd54f"/>
    <stop offset="100%" stop-color="#ff6b35"/>
  </radialGradient>
  <linearGradient id="hairB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2c1a0e"/>
    <stop offset="100%" stop-color="#1a0a04"/>
  </linearGradient>
  <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3d1f00"/>
    <stop offset="100%" stop-color="#1a0a00"/>
  </linearGradient>
  <radialGradient id="ballR" cx="30%" cy="28%" r="60%">
    <stop offset="0%" stop-color="#ff8fab"/>
    <stop offset="100%" stop-color="#c9184a"/>
  </radialGradient>
  <radialGradient id="ballP" cx="30%" cy="28%" r="60%">
    <stop offset="0%" stop-color="#d4a0ff"/>
    <stop offset="100%" stop-color="#7b2fbe"/>
  </radialGradient>
  <radialGradient id="ballY" cx="30%" cy="28%" r="60%">
    <stop offset="0%" stop-color="#ffe08a"/>
    <stop offset="100%" stop-color="#e67e00"/>
  </radialGradient>
  <radialGradient id="ballM" cx="30%" cy="28%" r="60%">
    <stop offset="0%" stop-color="#a8f0d8"/>
    <stop offset="100%" stop-color="#0d9b6a"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  @keyframes flicker {
    0%,100%{transform-origin:50% 100%;transform:scaleX(1) scaleY(1) rotate(-2deg)}
    50%{transform-origin:50% 100%;transform:scaleX(.85) scaleY(1.12) rotate(3deg)}
  }
  @keyframes balFloat {
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%{transform:translateY(-8px) rotate(3deg)}
  }
  @keyframes heartBeat {
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.18)}
  }
  @keyframes girlClap {
    0%,100%{transform:rotate(0deg)}
    25%{transform:rotate(-6deg)}
    75%{transform:rotate(6deg)}
  }
  @keyframes starTwinkle {
    0%,100%{opacity:.4;transform:scale(1)}
    50%{opacity:1;transform:scale(1.3)}
  }
  @keyframes boyLean {
    0%,100%{transform:rotate(0deg)}
    50%{transform:rotate(-3deg)}
  }
  @keyframes noteFloat {
    0%,100%{transform:translateY(0) rotate(-5deg);opacity:.7}
    50%{transform:translateY(-10px) rotate(5deg);opacity:1}
  }
  .flame-anim { animation:flicker .3s ease-in-out infinite; }
  .bal1 { animation:balFloat 2.2s ease-in-out infinite; transform-origin:45px 110px; }
  .bal2 { animation:balFloat 2.6s .4s ease-in-out infinite; transform-origin:45px 110px; }
  .bal3 { animation:balFloat 2s .8s ease-in-out infinite; transform-origin:45px 110px; }
  .bal4 { animation:balFloat 2.4s 1.2s ease-in-out infinite; transform-origin:45px 110px; }
  .hrt  { animation:heartBeat 1.2s ease-in-out infinite; transform-origin:50% 50%; }
  .girl-body { animation:girlClap 1s ease-in-out infinite; transform-origin:258px 340px; }
  .star1 { animation:starTwinkle 2s .0s ease-in-out infinite; }
  .star2 { animation:starTwinkle 2s .5s ease-in-out infinite; }
  .star3 { animation:starTwinkle 2s 1s ease-in-out infinite; }
  .star4 { animation:starTwinkle 2s 1.5s ease-in-out infinite; }
  .note1 { animation:noteFloat 3s ease-in-out infinite; }
  .note2 { animation:noteFloat 3s .8s ease-in-out infinite; }
  .boy-grp { animation:boyLean 2s ease-in-out infinite; transform-origin:120px 360px; }
</style>

